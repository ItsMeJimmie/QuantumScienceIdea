# Site settings

title:               "Wright State University Quantum Sciences"
description:         "An organization for exploring all things quantum"
tagline:             "An organization for exploring all things quantum"
author:              "Quantum Sciences Club"

# Used by jekyll-seo-tag, jekyll-feed and the `relative_url` filter.
url:                 "https://wsu-quantum-sciences.github.io"
baseurl:             ""

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

# jekyll-paginate needs both of these to generate /page2/, /page3/, ...
paginate:            5
paginate_path:       "/blog/page:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - vendor

# Default link-preview image for every page. jekyll-seo-tag reads
# `page.image`, so a Jekyll default is what makes it site-wide; a page or
# post that sets its own `image` still overrides this.
#
# jekyll-seo-tag promotes twitter:card to summary_large_image as soon as
# an image exists, which crops to roughly 2:1 and would slice the qubit
# bars off the top and bottom of a square logo. Forced back to summary.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/WSUQS_Logo.png

twitter:
  card: summary
