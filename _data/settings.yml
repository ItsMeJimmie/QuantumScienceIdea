# Social icons are rendered with Font Awesome, so any icon it offers works.
# Uncomment and fill in to show them in the header and footer.
# Social links shown in the header, the mobile menu and the footer.
# `icon` must name one defined in _includes/icon.html: email, github,
# discord, linkedin, instagram, youtube, x, facebook, rss, link.
# `label` is read aloud by screen readers in place of the icon, so make
# it say where the link goes.
# Uncomment and fill in a line to add it; delete a line to remove it.
social:
- {icon: 'email', link: 'mailto:cox.366@wright.edu', label: 'Email WSU Quantum Sciences'}
- {icon: 'link',  link: 'https://wright.campuslabs.com/engage/organization/wsuquantum', label: 'WSU Quantum Sciences on Engage'}
- {icon: 'discord', link: 'https://discord.gg/xTszxFKkWj', label: 'Join the Quantum Sciences Discord'}
- {icon: 'rss',   link: '/feed.xml', label: 'Subscribe to the feed'}
