<header class="site-header">
  <p class="site-title">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </p>
  <nav class="menu-list" aria-label="Main">
    {% for item in site.data.settings.menu %}
      <a href="{{ item.url | relative_url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
    {% include social-links.html %}
  </nav>
  <div class="dropdown">
    <button type="button" class="menu-toggle" id="MenuToggle"
            aria-expanded="false" aria-controls="MenuDropdown" aria-label="Menu">
      {% include icon.html name="menu" %}
    </button>
    <div class="dropdown-content" id="MenuDropdown">
      {% for item in site.data.settings.menu %}
        <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
      {% endfor %}
      {% include social-links.html %}
    </div>
  </div>
  <script>
    (function () {
      var toggle = document.getElementById("MenuToggle");
      var menu = document.getElementById("MenuDropdown");
      if (!toggle || !menu) return;
      toggle.addEventListener("click", function () {
        var open = menu.classList.toggle("is-open");
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
  </script>
</header>
